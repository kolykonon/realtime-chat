[project]
name = "chat-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kolykonon", email = "kononikhinnikolay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mypy>=2.3.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.16.8",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
chat-service = "chat_service:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
