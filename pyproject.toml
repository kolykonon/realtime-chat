[project]
name = "chat-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kolykonon", email = "kononikhinnikolay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
chat-service = "chat_service:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
